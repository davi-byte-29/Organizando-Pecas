<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Organizando Peças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>
<main class="app">
  <header class="head">
    <span class="tag">// PUZZLE.SYS · ONLINE</span>
    <h1>Organizando <em>Peças</em></h1>
  </header>

  <div class="board-wrap">
    <div class="board-frame">
      <div id="board" class="board" role="grid" aria-label="Tabuleiro"></div>
      <div id="win" class="win" hidden>
        <div class="win-card">
          <small>// SISTEMA RESTAURADO</small>
          <h2>Missão cumprida!</h2>
          <p id="win-text"></p>
          <button id="again" class="btn primary">Jogar de novo</button>
        </div>
      </div>
    </div>
  </div>

  <section class="stats" aria-live="polite">
    <div class="stat"><span>Movimentos</span><b id="moves">0</b></div>
    <div class="stat"><span>Tempo</span><b id="time">00:00</b></div>
    <div class="stat"><span>Recorde</span><b id="best">--</b></div>
  </section>

  <section class="controls">
    <select id="size" aria-label="Tamanho do tabuleiro">
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5" selected>5 × 5</option>
    </select>
    <button id="shuffle" class="btn primary">Embaralhar</button>
    <button id="peek" class="btn">Ver imagem</button>
    <p class="hint">Toque numa peça para deslizá-la · setas do teclado também funcionam</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
